<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6e4e0">
<title>&#9825;</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;background:#fdfaf9;color:#40211f}
#gate{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(165deg,#faf1ee 0%,#f6e4e0 55%,#f0d8d4 100%);transition:opacity .7s ease,visibility .7s}
#gate.out{opacity:0;visibility:hidden}
.heart{width:56px;height:56px;color:#a4504d;margin-bottom:34px;animation:beat 2.8s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.row{display:flex;align-items:center;gap:10px;width:100%;max-width:320px}
#pw{flex:1;min-width:0;height:52px;padding:0 20px;font-size:16px;text-align:center;color:#40211f;background:#fff;border:1px solid #e0c3bf;border-radius:999px;outline:none;-webkit-appearance:none;appearance:none}
#pw:focus{border-color:#a4504d;box-shadow:0 0 0 3px rgba(164,80,77,.15)}
#go{flex:none;width:52px;height:52px;display:grid;place-items:center;color:#fff;background:#a4504d;border:0;border-radius:50%;cursor:pointer}
#go:active{background:#8f4340}
#go svg{width:22px;height:22px}
.bad #pw{border-color:#c0504d;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#site{display:none;padding:28px 16px calc(40px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto;opacity:0;transition:opacity 1s ease}
#site.in{opacity:1}
#site .top{display:flex;justify-content:center;margin:8px 0 26px;color:#a4504d}
#site .top svg{width:34px;height:34px}
.hero{display:block;width:100%;max-width:520px;margin:0 auto 14px}
.grid{column-count:1;column-gap:14px}
@media(min-width:640px){.grid{column-count:2}#site{padding-left:24px;padding-right:24px}}
@media(min-width:1000px){.grid{column-count:3}}
.ph{display:block;width:100%;margin:0 0 14px;break-inside:avoid;border-radius:18px;overflow:hidden;background:#f4e0dc;cursor:pointer;border:0;padding:0}
.ph img,.hero img{display:block;width:100%;height:auto;border-radius:18px}
.hero{border:0;padding:0;background:#f4e0dc;border-radius:18px;cursor:pointer}
#lb{position:fixed;inset:0;display:none;background:rgba(36,18,17,.94);z-index:10;touch-action:pan-y}
#lb.on{display:block}
#lb img{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;padding:max(env(safe-area-inset-top),16px) 0 max(env(safe-area-inset-bottom),16px)}
#lb button{position:absolute;display:grid;place-items:center;width:48px;height:48px;color:#fff;background:rgba(255,255,255,.14);border:0;border-radius:50%;cursor:pointer;z-index:2}
#lb svg{width:22px;height:22px}
#lx{top:max(env(safe-area-inset-top),14px);right:14px}
#lp{left:12px;top:50%;margin-top:-24px}
#ln{right:12px;top:50%;margin-top:-24px}
@media(max-width:639px){#lp,#ln{top:auto;bottom:max(env(safe-area-inset-bottom),18px);margin:0}#lp{left:calc(50% - 60px)}#ln{right:calc(50% - 60px)}}
</style>
</head>
<body>
<div id="gate">
  <svg class="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.9-9.8-9.1C.5 8.6 2.3 5 5.7 5c2 0 3.4 1.1 4.2 2.3l2.1 2.9 2.1-2.9C14.9 6.1 16.3 5 18.3 5c3.4 0 5.2 3.6 3.5 6.9C19.5 16.1 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
  <div class="row" id="row">
    <input id="pw" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="password">
    <button id="go" type="button" aria-label="enter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</div>
<main id="site">
  <div class="top"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.9-9.8-9.1C.5 8.6 2.3 5 5.7 5c2 0 3.4 1.1 4.2 2.3l2.1 2.9 2.1-2.9C14.9 6.1 16.3 5 18.3 5c3.4 0 5.2 3.6 3.5 6.9C19.5 16.1 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
  <div id="hero"></div>
  <div class="grid" id="grid"></div>
</main>
<div id="lb">
  <button id="lx" type="button" aria-label="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button id="lp" type="button" aria-label="previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
  <button id="ln" type="button" aria-label="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
  <img id="li" alt="">
</div>
<script>
(function(){
var H='f88b099c1b1f0139af02c42aae2992bf297735ae55f3bbaa7f033a8b6653e5aa';
var N=12, files=[];
for(var k=1;k<=N;k++)files.push('p'+(k<10?'0':'')+k+'.txt');
var pw=document.getElementById('pw'),row=document.getElementById('row');
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return('0'+b.toString(16)).slice(-2)}).join('')}
function norm(s){return s.toLowerCase().replace(/\s+/g,' ').trim()}
async function check(){
  var d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(norm(pw.value)));
  if(hex(d)===H){unlock()}else{
    row.classList.remove('bad');void row.offsetWidth;row.classList.add('bad');
    setTimeout(function(){row.classList.remove('bad')},500);
  }
}
document.getElementById('go').addEventListener('click',check);
pw.addEventListener('keydown',function(e){if(e.key==='Enter')check()});
var cur=0,lb=document.getElementById('lb'),li=document.getElementById('li');
function show(i){cur=(i+N)%N;li.src=files[cur]}
function open(i){show(i);lb.classList.add('on');document.body.style.overflow='hidden'}
function close(){lb.classList.remove('on');document.body.style.overflow=''}
document.getElementById('lx').onclick=close;
document.getElementById('lp').onclick=function(){show(cur-1)};
document.getElementById('ln').onclick=function(){show(cur+1)};
lb.addEventListener('click',function(e){if(e.target===lb||e.target===li)close()});
document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
var sx=null;
lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
lb.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50){show(dx<0?cur+1:cur-1)}},{passive:true});
function mk(i,cls){
  var b=document.createElement('button');b.type='button';b.className=cls;b.setAttribute('aria-label','photo');
  var im=document.createElement('img');im.src=files[i];im.alt='';im.decoding='async';
  if(i>2)im.loading='lazy';
  b.appendChild(im);b.addEventListener('click',function(){open(i)});return b;
}
async function unlock(){
  try{files=await Promise.all(files.map(function(n){return fetch(n).then(function(r){return r.text()})}))}catch(e){return}
  var hero=document.getElementById('hero'),grid=document.getElementById('grid');
  hero.appendChild(mk(0,'hero'));
  for(var i=1;i<N;i++)grid.appendChild(mk(i,'ph'));
  var s=document.getElementById('site');s.style.display='block';
  document.getElementById('gate').classList.add('out');
  requestAnimationFrame(function(){requestAnimationFrame(function(){s.classList.add('in')})});
  pw.value='';
}
})();
</script>
</body>
    </html>
